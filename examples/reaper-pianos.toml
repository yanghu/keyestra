[reaper]
# Daily Live config: one Garritan track and one reusable Pianoteq VST track.
address = "127.0.0.1:8080"
# If the REAPER web interface requires login, uncomment both lines:
# username = "keyestra"
# password = "change-me"
timeout_ms = 800

# Prototype control target. REAPER receives OSC on this PC only; the phone still
# connects exclusively to Keyestra's normal web port.
[pianoteq_vst]
piano_id = "pianoteq-live"
track = "Pianoteq Live"
fx = 1
osc_address = "127.0.0.1:9000"
# Must match the OSC surface's device port. Keyestra listens only while fetching
# fresh control values after a named preset is selected.
osc_feedback_address = "127.0.0.1:9001"
midi_control_output = "Pianoteq Control In"
# The displayed presets come from the static Keyestra mapping in
# src/pianoteq_midi.rs. Old [[pianoteq_vst.preset]] entries below are accepted
# only for migration and are ignored by native Pianoteq preset selection.
[[pianoteq_vst.preset]]
id = "sk-ex-player"
name = "PT | SK-EX | Player"
reaper_preset = "PT | SK-EX | Player"

